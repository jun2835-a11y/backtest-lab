<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BACK TEST · 검증 안내판</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">

    <header class="masthead">
      <div class="mast-top">
        <div class="plane-badge">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.41 15.09v.58c0 .73-.6 1.33-1.33 1.33h-.01c-.73 0-1.33-.6-1.33-1.33v-.6c-1.33-.28-2.51-1.01-3.01-2.24-.23-.55.2-1.16.8-1.16h.24c.37 0 .67.25.81.6.29.75 1.05 1.27 2.2 1.27 1.54 0 2.02-.77 2.02-1.25 0-.65-.35-1.26-2.13-1.68-1.98-.48-3.34-1.3-3.34-2.94 0-1.37 1.11-2.27 2.48-2.57V6.9c0-.73.6-1.33 1.33-1.33h.01c.73 0 1.33.6 1.33 1.33v.62c1.38.34 2.25 1.2 2.63 2.26.2.55-.22 1.13-.81 1.13h-.26c-.37 0-.67-.26-.77-.62-.23-.76-.86-1.25-1.98-1.25-1.4 0-2.02.6-2.02 1.34 0 .65.35 1.26 2.13 1.68 1.98.48 3.34 1.3 3.34 2.94 0 1.37-1.11 2.27-2.48 2.57z"/></svg>
        </div>
        <h1>BACK TEST</h1>
      </div>
      <div class="status-chips">
        <span class="chip" id="chip-llm"><span class="dot"></span><span>파서 확인중…</span></span>
        <span class="chip on"><span class="dot"></span>DATA · YAHOO (실 + 3배합성)</span>
      </div>
    </header>

    <div class="pipeline" id="pipeline">
      <div class="step" data-step="0"><div class="n">01</div><div class="t">요청</div></div>
      <div class="step" data-step="1"><div class="n">02</div><div class="t">사전등록 잠금</div></div>
      <div class="step" data-step="2"><div class="n">03</div><div class="t">이중 관문</div></div>
      <div class="step" data-step="3"><div class="n">04</div><div class="t">평원</div></div>
      <div class="step" data-step="4"><div class="n">05</div><div class="t">판정 · 안내판</div></div>
    </div>

    <!-- 1. 요청 -->
    <section class="panel" id="p-request">
      <h2><span class="idx">01</span> 자연어 전략 요청</h2>
      <p class="hint">예: "TQQQ·SOXL에 200일 이동평균 타이밍, 5종목 중 3개 통과해야 채택" — 문장으로 적으세요.</p>
      <textarea id="request" placeholder="이런 전략 백테스트 해줘 …"></textarea>
      <div class="examples" id="examples"></div>
      <div class="btn-row">
        <button class="btn primary" id="btn-parse">해석 → 사전등록 초안</button>
        <span id="parse-status"></span>
      </div>
    </section>

    <!-- 2. 사전등록 -->
    <section class="panel hidden" id="p-prereg">
      <h2><span class="idx">02</span> 사전등록 <span id="reg-seal" class="seal-stamp">등록됨 · 봉인</span></h2>
      <fieldset id="prereg-form">
        <div class="prereg-grid" id="prereg-grid"></div>
        <div class="field" style="margin-bottom:16px">
          <label>대상 종목 (다종목 확장)</label>
          <div class="ticker-toggles" id="ticker-toggles"></div>
        </div>
      </fieldset>
      <div class="btn-row">
        <button class="btn seal" id="btn-lock">🔒 사전등록 잠금</button>
        <button class="btn primary hidden" id="btn-run">▶ 안내판 띄우기</button>
        <button class="btn hidden" id="btn-unlock">잠금 해제(재등록)</button>
      </div>
      <div class="locked-notice" id="overfit-notice">⚠ 사전등록 이후 기준을 변경했습니다. 이건 과적합입니다 — 재등록으로 새 봉인을 찍거나 원값으로 되돌리세요.</div>
    </section>

    <!-- 3. 결과 안내판 -->
    <section class="panel hidden" id="p-result">
      <h2><span class="idx">03</span> 판정 · 출발 안내판</h2>
      <div id="result-body"></div>
    </section>

    <footer class="foot">
      <div>백테스트는 미래 수익을 보장하지 않습니다.</div>
    </footer>

  </div>
  <script src="app.js"></script>
</body>
</html>
